[workspace]
authors = ["Nickolas K Freeman <nick.freeman524@gmail.com>"]
channels = ["conda-forge"]
name = "BAN-501-Spring-2026-ICWIP"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[feature.gpu]
platforms = ["linux-64", "win-64"]

[feature.gpu.system-requirements]
cuda = "13.0"

[feature.cpu.dependencies]
pytorch-cpu = "*"

[tasks]

[dependencies]
python = ">=3.14.3,<3.15"
pyarrow = ">=23.0.1,<24"
polars = ">=1.38.1,<2"
statsmodels = ">=0.14.6,<0.15"
scikit-learn = ">=1.8.0,<2"
pacmap = ">=0.8.0,<0.9"
matplotlib = ">=3.10.8,<4"
seaborn = ">=0.13.2,<0.14"
tqdm = ">=4.67.3,<5"
ipywidgets = ">=8.1.8,<9"
ipython = ">=9.10.0,<10"
marimo = ">=0.20.1,<0.21"
xgboost = ">=3.2.0,<4"
optuna = ">=4.7.0,<5"
pandoc = ">=3.9,<4"
torchvision = ">=0.25.0,<0.26"
pillow = ">=12.1.1,<13"
nbformat = ">=5.10.4,<6"
sentence-transformers = ">=5.3.0,<6"
transformers = ">=4.57.6,<5"
accelerate = ">=1.13.0,<2"

[feature.gpu.dependencies]
pytorch-gpu = "*"

[environments]
default = ["cpu"]
gpu = ["gpu"]
